[package]
name = "lazytmux"
version = "0.1.3"
edition = "2024"
authors = ["Amjad Hossain <amjad.jibon@gmail.com>"]
description = "A keyboard-first visual workspace explorer for tmux built in Rust with Ratatui"
license = "MIT"
readme = "README.md"
repository = "https://github.com/amjadjibon/lazytmux"
homepage = "https://github.com/amjadjibon/lazytmux"
keywords = ["tmux", "terminal", "tui", "ratatui", "workspace"]
categories = ["command-line-utilities"]

[dependencies]
# UI & Terminal
ratatui = "0.30"
crossterm = "0.29"
ansi-to-tui = "8.0"

# Fuzzy Finding & Search
nucleo-matcher = "0.3"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
directories = "6.0"

# Error Handling & Utilities
anyhow = "1.0"
arboard = "3.6"

[profile.release]
# "z" over 3: this is a UI-bound tool that spends its time waiting on tmux and
# on terminal input, not in hot loops. The only measurable compute is ANSI
# parsing, which is windowed to the visible viewport and runs at most once per
# capture. Costs ~25us per frame; saves ~320KB of binary.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

